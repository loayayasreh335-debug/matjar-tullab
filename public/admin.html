<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المطور | متجر الطلاب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            text-align: center;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-primary { background: #6f42c1; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-info { background: #17a2b8; color: #fff; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card h3 { font-size: 32px; color: #6f42c1; }
        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .ad-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .ad-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .ad-card .info { padding: 15px; }
        .ad-card .info h3 { margin-bottom: 10px; font-size: 18px; }
        .ad-card .info p { color: #aaa; font-size: 14px; margin-bottom: 5px; }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-bar select, .filter-bar input {
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
        }
        .hidden { display: none; }
        .section-title {
            font-size: 22px;
            margin: 40px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .escrow-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .escrow-card {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 18px;
            border-right: 4px solid #6f42c1;
        }
        .escrow-card p { color: #ddd; font-size: 14px; margin-bottom: 6px; }
        .escrow-card .proof-img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 8px;
            margin: 10px 0;
            background: rgba(0,0,0,0.3);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .status-PENDING_PAYMENT { background: #ffc107; color: #000; }
        .status-PAYMENT_VERIFIED { background: #17a2b8; color: #fff; }
        .status-DATA_SUBMITTED { background: #6f42c1; color: #fff; }
        .status-PAYOUT_PENDING { background: #0ea5e9; color: #fff; }
        .status-DISPUTED { background: #dc3545; color: #fff; }
        .status-COMPLETED { background: #28a745; color: #fff; }
        .status-REFUNDED { background: #6c757d; color: #fff; }
        .empty-msg { text-align:center; grid-column:1/-1; color:#aaa; padding:20px; }
        .dispute-box { background: rgba(220,53,69,0.15); border: 1px solid #dc3545; padding: 10px; border-radius: 8px; margin: 8px 0; font-size: 13px; }
        .escrow-card .actions { display: flex; gap: 8px; margin-top: 10px; }
        .escrow-card .actions .btn { flex: 1; padding: 10px; font-size: 13px; }
        .btn-warning { background: #f59e0b; color: #000; }
        .elapsed-time { font-size: 12px; color: #f59e0b; margin-bottom: 8px; display: block; }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-box">
        <h2>🔐 دخول المطور</h2>
        <input type="password" id="passwordInput" placeholder="كلمة المرور">
        <br>
        <button class="btn btn-primary" onclick="login()">دخول</button>
        
    </div>

    <div id="dashboardScreen" class="container hidden">
        <div class="header">
            <h1>🛠️ لوحة تحكم المطور</h1>
            <p>إدارة الإعلانات وطلبات الوسيط - متجر الطلاب</p>
            <button class="btn btn-danger" onclick="logout()" style="margin-top:15px;">🚪 خروج</button>
        </div>

        <div class="stats" id="statsContainer"></div>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="🔍 بحث..." oninput="loadAds()">
            <select id="filterType" onchange="loadAds()">
                <option value="">كل الأنواع</option>
                <option value="sell">بيع</option>
                <option value="barter">مقايضة</option>
                <option value="auction">مزاد</option>
            </select>
        </div>

        <div class="ads-grid" id="adsContainer"></div>

        <div class="section-title">
            <span>🤝 طلبات الوسيط المعلّقة</span>
            <button class="btn btn-primary" onclick="loadEscrowSessions()" style="padding:8px 20px;font-size:14px;">🔄 تحديث</button>
        </div>
        <div class="escrow-grid" id="escrowContainer"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
