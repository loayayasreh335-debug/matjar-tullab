<!-- public/my-token.html -->
<!-- صفحة مؤقتة للتطوير فقط — تعرض توكن جلستك كنص تقدر تنسخه، بدون كونسول -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توكن الجلسة - سوقنا</title>
  <style>
    body { direction: rtl; font-family: sans-serif; background: #0B1E3D; color: #F8F4EA; padding: 20px; }
    h1 { color: #C9A227; font-size: 18px; }
    textarea {
      width: 100%; box-sizing: border-box; min-height: 90px;
      border-radius: 10px; border: none; padding: 12px;
      font-family: monospace; font-size: 13px; margin-top: 8px;
    }
    p { font-size: 13px; color: #D8DEE8; }
    .warn { background: #7A2E24; padding: 10px; border-radius: 10px; margin-top: 20px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🔑 حالة تسجيل الدخول</h1>
  <div id="result">جاري الفحص...</div>

  <script src="/auth.js"></script>
  <script>
    const result = document.getElementById('result');
    const token = getSessionToken();
    const user = getCurrentUser();

    if (!token) {
      result.innerHTML = '<p>❌ أنت مش مسجل دخول بهاد المتصفح. سجل دخول أول من الصفحة الرئيسية.</p>';
    } else {
      result.innerHTML = `
        <p>مسجل دخول باسم: <b>${user ? user.name : '—'}</b></p>
        <p>توكن الجلسة (اضغط مطولاً وانسخه):</p>
        <textarea readonly onclick="this.select()">${token}</textarea>
        <div class="warn">⚠️ هاد التوكن زي كلمة السر — لا ترسله لحدا. احذف هالصفحة بعد ما تخلص تطوير.</div>
      `;
    }
  </script>
</body>
</html>
